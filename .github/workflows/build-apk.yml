name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Android Project & Gradle Wrapper Structure
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Error: Gradle wrapper ('gradlew') was not found in the project directory."
            exit 1
          fi
          if [ ! -d "app" ]; then
            echo "Error: Application module directory ('app') was not found."
            exit 1
          fi

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Clean Project Caches & Build Artifacts
        run: |
          echo "Removing stale project-level Gradle cache and build outputs..."
          rm -rf .gradle app/build

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        id: verify-apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Error: No debug APK file was found in app/build/outputs/apk/debug."
            exit 1
          fi
          echo "Successfully verified APK file at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
